<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>insane calc</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="metal">
    <div id="display">0</div>
    <div id="btns-container">
      <div class="first-row">
        <div id="clear-all" class="op-btn">CE</div>
        <div id="backspace" class="op-btn">⬅</div>
      </div>
      <div class="btns">
        <div class="num-btn">7</div>
        <div class="num-btn">8</div>
        <div class="num-btn">9</div>
        <div class="op-btn">+</div>
      </div>
      <div class="btns">
        <div class="num-btn">4</div>
        <div class="num-btn">5</div>
        <div class="num-btn">6</div>
        <div class="op-btn">-</div>
      </div>
      <div class="btns">
        <div class="num-btn">1</div>
        <div class="num-btn">2</div>
        <div class="num-btn">3</div>
        <div class="op-btn">×</div>
      </div>
      <div class="btns">
        <div class="num-btn">0</div>
        <div class="op-btn dot-btn">.</div>
        <div class="op-btn equals">=</div>
        <div class="op-btn">÷</div>
      </div>
    </div>
  </div>
</body>

<script src="scripts.js"></script>

</html>
