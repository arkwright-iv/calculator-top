<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>insane calc</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="metal">
    <div id="display">0</div>
    <div id="btns-container">
      <div class="first-row">
        <button id="c" class="op-btn">CE</button>
        <button id="Backspace" class="op-btn">⬅</button>
      </div>
      <div class="btns">
        <button id="7" class="num-btn">7</button>
        <button id="8" class="num-btn">8</button>
        <button id="9" class="num-btn">9</button>
        <button id="+" class="op-btn">+</button>
      </div>
      <div class="btns">
        <button id="4" class="num-btn">4</button>
        <button id="5" class="num-btn">5</button>
        <button id="6" class="num-btn">6</button>
        <button id="-" class="op-btn">-</button>
      </div>
      <div class="btns">
        <button id="1" class="num-btn">1</button>
        <button id="2" class="num-btn">2</button>
        <button id="3" class="num-btn">3</button>
        <button id="*" class="op-btn">×</button>
      </div>
      <div class="btns">
        <button id="0" class="num-btn">0</button>
        <button id="." class="op-btn dot-btn">.</button>
        <button id="=" class="op-btn equals-btn">=</button>
        <button id="/" class="op-btn">÷</button>
      </div>
    </div>
  </div>
</body>

<script src="scripts.js"></script>

</html>
